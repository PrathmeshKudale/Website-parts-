<!DOCTYPE html>
<html>
<head>
<title>Website Builder Simulator</title>
<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:"Segoe UI",Arial;
  background:#0f172a;
  color:white;
  height:100vh;
  overflow:hidden;
}

h1{
  text-align:center;
  margin:15px 0;
}

.subtitle{
  text-align:center;
  color:#94a3b8;
}

.game{
  height:85vh;
  width:95%;
  margin:auto;
  display:grid;
  grid-template-columns:260px 1fr;
  gap:20px;
}

/* COMPONENT PANEL */
.panel{
  background:#1e293b;
  border-radius:25px;
  padding:20px;
  overflow-y:auto;
  box-shadow:0 20px 40px #0008;
}

.panel h2{
  color:#38bdf8;
}

.part{
  padding:16px;
  margin:12px 0;
  border-radius:16px;
  cursor:grab;
  font-weight:bold;
  transition:.3s;
  box-shadow:0 8px 15px #0005;
}

.part:hover{
  transform:scale(1.05);
}

/* Button Colors */
.header { background:#ef4444; }
.nav { background:#3b82f6; }
.hero { background:#8b5cf6; }
.image { background:#10b981; }
.content { background:#f59e0b; color:#111; }
.card { background:#f97316; }
.form { background:#06b6d4; }
.footer { background:#334155; }

/* PREVIEW */
.preview{
  background:#e2e8f0;
  border-radius:25px;
  padding:15px;
  overflow:auto;
  box-shadow:0 20px 50px #0008;
}

.browser{
  background:white;
  min-height:650px;
  border-radius:20px;
  overflow:hidden;
  color:#111;
  transition: .5s;
}

.browserbar{
  height:45px;
  background:#1e293b;
  display:flex;
  align-items:center;
  padding:10px;
  gap:10px;
  transition: .5s;
}

.dot{
  height:14px;
  width:14px;
  border-radius:50%;
  background:#ef4444;
}

.zone{
  margin:15px;
  min-height:85px;
  border:3px dashed #94a3b8;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  color:#64748b;
  transition:.3s;
  overflow: hidden;
}

.zone:hover{
  background:#dbeafe;
}

/* Completed state before final reveal */
.completed{
  border:3px solid #22c55e;
  animation:pop .4s;
}

/* This class triggers at the end to make it a seamless website */
.seamless{
  border:none !important;
  margin:0 !important;
  border-radius:0 !important;
  padding:0 !important;
}

@keyframes pop{
  from{ transform:scale(.8); }
  to{ transform:scale(1); }
}

/* POPUP MESSAGES */
#popup{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:#020617;
  border:2px solid #38bdf8;
  padding:30px;
  width:350px;
  border-radius:25px;
  display:none;
  font-size:20px;
  box-shadow:0 20px 60px black;
  text-align: center;
  z-index: 1000;
}
</style>
</head>

<body>

<h1>🧩 Website Builder Simulator</h1>
<div class="subtitle">
Drag website parts and build a real webpage!
</div>

<div class="game">
  <div class="panel">
    <h2>Components</h2>
    
    <div class="part hero" draggable="true" data-type="hero">Hero Section</div>
    <div class="part card" draggable="true" data-type="card">Cards</div>
    <div class="part nav" draggable="true" data-type="nav">Navigation</div>
    <div class="part form" draggable="true" data-type="form">Form</div>
    <div class="part header" draggable="true" data-type="header">Header</div>
    <div class="part image" draggable="true" data-type="image">Image</div>
    <div class="part footer" draggable="true" data-type="footer">Footer</div>
    <div class="part content" draggable="true" data-type="content">Content</div>
    </div>

  <div class="preview">
    <div class="browser" id="mainBrowser">
      <div class="browserbar" id="browserBar">
        <div class="dot"></div>
        <div class="dot" style="background:#eab308"></div>
        <div class="dot" style="background:#22c55e"></div>
      </div>

      <div class="zone" data-place="header">Header Area</div>
      <div class="zone" data-place="nav">Navigation Area</div>
      <div class="zone" data-place="hero">Hero Area</div>
      <div class="zone" data-place="image">Image Area</div>
      <div class="zone" data-place="content">Content Area</div>
      <div class="zone" data-place="card">Cards Area</div>
      <div class="zone" data-place="form">Form Area</div>
      <div class="zone" data-place="footer">Footer Area</div>
    </div>
  </div>
</div>

<div id="popup"></div>

<script>
let dragged;
let completedCount = 0; // Tracks how many items are placed

document.querySelectorAll(".part").forEach(item => {
  item.addEventListener("dragstart", () => {
    dragged = item;
  });
});

document.querySelectorAll(".zone").forEach(zone => {
  zone.addEventListener("dragover", e => {
    e.preventDefault();
  });

  zone.addEventListener("drop", () => {
    let need = zone.dataset.place;
    let got = dragged.dataset.type;

    if(need == got){
      zone.classList.add("completed");
      zone.innerHTML = createPart(got);
      showInfo(got);
      dragged.remove();
      
      completedCount++;
      
      // Check if all 8 parts are placed
      if(completedCount === 8) {
        setTimeout(triggerGrandReveal, 1500);
      }
    } else {
      showInfo("wrong");
    }
  });
});

function createPart(type){
  let parts={
    header: `
      <div style="background:#1e3a8a; color:white; padding:20px; font-size:28px; font-weight:bold; text-align:center; width:100%;">
        🎓 GLOBAL CONNECT
      </div>
    `,
    nav: `
      <div style="background:#3b82f6; padding:15px; color:white; text-align:center; font-weight:500; width:100%;">
        Home &nbsp;|&nbsp; Academics &nbsp;|&nbsp; Admissions &nbsp;|&nbsp; Campus Life
      </div>
    `,
    hero: `
      <div style="background:linear-gradient(135deg, #1e3a8a, #3b82f6); color:white; padding:60px 20px; text-align:center; width:100%;">
        <h1 style="margin:0; font-size:36px;">Welcome to GLOBAL CONNECT</h1>
        <p style="font-size:18px;">Empowering students to achieve excellence today for a better tomorrow.</p>
      </div>
    `,
    image: `
      <div style="padding:30px; text-align:center; background:#f8fafc; width:100%;">
        <div style="background:#e2e8f0; width:100%; max-width:600px; height:250px; margin:auto; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:60px; box-shadow:0 10px 15px -3px rgba(0,0,0,0.1);">
          🏫 🧑‍🎓 📚
        </div>
      </div>
    `,
    content: `
      <div style="padding:40px 20px; background:white; color:#334155; text-align:center; font-size:18px; line-height:1.6; width:100%;">
        <h2 style="color:#0f172a;">Why Choose Us?</h2>
        <p style="max-width:800px; margin:auto;">Many rural students miss out on global learning opportunities. Global Connect bridges this gap by bringing international mentors, modern technology, and diverse cultures right into the classroom. We believe where you live shouldn't limit what you can achieve!</p>
      </div>
    `,
    card: `
      <div style="background:#f1f5f9; padding:40px 20px; display:flex; gap:20px; justify-content:center; flex-wrap:wrap; width:100%;">
        <div style="background:white; padding:25px; border-radius:12px; box-shadow:0 4px 6px -1px rgba(0,0,0,0.1); width:200px; text-align:center;">
          <span style="font-size:40px;">🔬</span><h3>Science Labs</h3>
        </div>
        <div style="background:white; padding:25px; border-radius:12px; box-shadow:0 4px 6px -1px rgba(0,0,0,0.1); width:200px; text-align:center;">
          <span style="font-size:40px;">⚽</span><h3>Athletics</h3>
        </div>
        <div style="background:white; padding:25px; border-radius:12px; box-shadow:0 4px 6px -1px rgba(0,0,0,0.1); width:200px; text-align:center;">
          <span style="font-size:40px;">🎨</span><h3>Arts & Culture</h3>
        </div>
      </div>
    `,
    form: `
      <div style="background:white; padding:40px 20px; text-align:center; border-top:1px solid #e2e8f0; width:100%;">
        <h3 style="color:#0f172a; margin-top:0;">Request an Information Packet</h3>
        <input placeholder="Parent's Name" style="padding:10px; margin:5px; border:1px solid #cbd5e1; border-radius:6px; width:200px;">
        <input placeholder="Student's Grade" style="padding:10px; margin:5px; border:1px solid #cbd5e1; border-radius:6px; width:200px;">
        <button style="padding:10px 20px; background:#2563eb; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">Submit</button>
      </div>
    `,
    footer: `
      <div style="background:#0f172a; color:#94a3b8; padding:25px; text-align:center; font-size:14px; width:100%;">
        © 2026 GLOBAL CONNECT. All rights reserved.
      </div>
    `
  };
  return parts[type];
}

function showInfo(type){
  let text={
    header: "Header: Contains school name and logo",
    nav: "Navigation: Helps parents and students move between pages",
    hero: "Hero: The welcoming banner of the school",
    image: "Image: Shows a photo of the school campus",
    content: "Content: Main information about the school's mission",
    card: "Cards: Highlights facilities like Labs, Sports, and Arts",
    form: "Form: Collects admission inquiries from parents",
    footer: "Footer: Copyright and bottom links",
    wrong: "❌ Wrong location. Think about real websites"
  };

  let box = document.getElementById("popup");
  box.innerHTML = text[type];
  box.style.display = "block";
  box.style.background = "#020617";
  box.style.borderColor = "#38bdf8";

  setTimeout(() => {
    box.style.display = "none";
  }, 2000);
}

// Function to run when all elements are placed
function triggerGrandReveal() {
  let box = document.getElementById("popup");
  
  // Show congratulatory popup
  box.innerHTML = "🎉 AMAZING WORK! 🎉<br><br>You just built a fully functional Website!<br>Scroll down to see your creation.";
  box.style.display = "block";
  box.style.background = "#22c55e"; // Green success color
  box.style.borderColor = "#fff";
  
  setTimeout(() => {
    box.style.display = "none";
  }, 4500);

  // Remove the dashed borders and margins to create a seamless website
  document.querySelectorAll(".zone").forEach(zone => {
    zone.classList.add("seamless");
  });
}
</script>

</body>
</html>
